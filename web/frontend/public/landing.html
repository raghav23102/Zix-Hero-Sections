<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install Zix Hero Sections</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    
    <!-- Simple Banner -->
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
      
      <!-- Left side: Information -->
      <div class="bg-blue-600 text-white p-10 md:w-1/2 flex flex-col justify-center">
        <h1 class="text-3xl font-bold mb-4">Zix Hero Sections</h1>
        <p class="text-blue-100 text-lg">
          Add beautiful, high-converting hero banners to your Shopify store in seconds. No coding required.
        </p>
      </div>

      <!-- Right side: Install Form -->
      <div class="p-10 md:w-1/2 flex flex-col justify-center bg-white">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Install App</h2>
        <p class="text-gray-500 mb-6 text-sm">Enter your Shopify store URL to get started.</p>
        
        <form id="install-form" class="space-y-4">
          <div>
            <label for="shop-url" class="block text-sm font-medium text-gray-700 mb-1">Store URL</label>
            <input 
              type="text" 
              id="shop-url" 
              name="shop" 
              required 
              placeholder="e.g. my-store.myshopify.com" 
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
            >
            <p id="error-msg" class="text-red-500 text-sm mt-2 hidden">Please enter a valid .myshopify.com URL</p>
          </div>
          
          <button 
            type="submit" 
            class="w-full bg-black hover:bg-gray-800 text-white font-medium rounded-lg px-4 py-3 transition-colors"
          >
            Install on Shopify
          </button>
        </form>
      </div>

    </div>

    <!-- Installation Logic -->
    <script>
      document.getElementById('install-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const input = document.getElementById('shop-url');
        const errorMsg = document.getElementById('error-msg');
        let shopUrl = input.value.trim().toLowerCase();

        if (!shopUrl) return;

        shopUrl = shopUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');

        if (!shopUrl.endsWith('.myshopify.com')) {
          if (shopUrl.includes('.')) {
            errorMsg.textContent = 'Please use your .myshopify.com domain, not your custom domain.';
            errorMsg.classList.remove('hidden');
            return;
          }
          shopUrl += '.myshopify.com';
        }

        errorMsg.classList.add('hidden');
        window.location.href = `/api/auth?shop=${encodeURIComponent(shopUrl)}`;
      });
    </script>
  </body>
</html>
