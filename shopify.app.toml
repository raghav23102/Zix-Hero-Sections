name = "zix-hero-sections"
client_id = "b032eb456c32ff2cc4b6a036d39feb1c"
application_url = "https://zixherosections.vercel.app"
embedded = true
organization_id = "5157587"

[access_scopes]
scopes = "write_themes,read_themes,write_metafields,read_metafields"

[auth]
redirect_urls = [
  "https://zixherosections.vercel.app/api/auth/callback",
  "https://zixherosections.vercel.app/api/auth/shopify/callback"
]

[access]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-07"

  # ---- Lifecycle webhooks ----
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/api/webhooks/subscription-update"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/api/webhooks/shop-update"

  # ---- MANDATORY GDPR / Privacy compliance webhooks ----
  # Required for Shopify App Store submission and public distribution
  [webhooks.privacy_compliance]
  customer_deletion_url = "/api/webhooks/customers/redact"
  customer_data_request_url = "/api/webhooks/customers/data_request"
  shop_deletion_url = "/api/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[pos]
embedded = false

[[extensions]]
type = "theme_app_extension"
name = "Zix Hero Sections"
handle = "zix-hero-sections"
