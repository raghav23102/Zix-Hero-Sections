name = "zix-hero-sections"
client_id = "b032eb456c32ff2cc4b6a036d39feb1c"
application_url = "{{ SHOPIFY_APP_URL }}"
embedded = true
organization_id = "5157587"

[access_scopes]
scopes = "write_themes,read_themes,read_products,write_products,read_script_tags,write_script_tags"

[auth]
redirect_urls = [
  "{{ SHOPIFY_APP_URL }}/api/auth/callback",
  "{{ SHOPIFY_APP_URL }}/api/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  # ---- Lifecycle webhooks ----
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/api/webhooks/subscription-update"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/api/webhooks/shop-update"

  # ---- MANDATORY GDPR / Privacy compliance webhooks ----
  # Required for Shopify App Store submission and public distribution
  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "/api/webhooks/customers-data-request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "/api/webhooks/customers-redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "/api/webhooks/shop-redact"

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[pos]
embedded = false
